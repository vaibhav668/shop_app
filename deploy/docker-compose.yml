# Bada Bazar on one server: Postgres, the API, nightly backups, and Caddy serving
# api./admin./shop.<DOMAIN> over HTTPS. Step-by-step guide: docs/DEPLOYMENT.md
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
name: bada-bazar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://shop:${POSTGRES_PASSWORD}@db:5432/shop
      CORS_ORIGINS: https://admin.${DOMAIN},https://shop.${DOMAIN}
      SHOP_TIMEZONE: Asia/Kolkata
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      GOOGLE_ALLOWED_CLIENT_IDS: ${GOOGLE_ALLOWED_CLIENT_IDS}
      ADMIN_COOKIE_SECURE: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      DEV_LOGIN_ENABLED: "false"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-fcm}
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-/run/secrets/firebase.json}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      # The Firebase service-account key, kept on the server only (never in git).
      - ${FIREBASE_KEY_PATH:-./secrets/firebase.json}:/run/secrets/firebase.json:ro
    # No published port: only Caddy reaches the API.

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://api.${DOMAIN}/api/v1
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
        EXPO_PUBLIC_ADMIN_URL: https://admin.${DOMAIN}
        VITE_API_URL: https://api.${DOMAIN}/api/v1
        VITE_SHOP_URL: https://shop.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # After the API is healthy, so its migrations have created the tables.
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: shop
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shop
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
